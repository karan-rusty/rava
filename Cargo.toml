[package]
name = "rava"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "CAVA-style terminal audio visualizer with a spectrum and bars"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29"
hound = "3.5"
realfft = "3.5"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
